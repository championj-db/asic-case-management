bundle:
  name: asic-case-mgmt

variables:
  vector_search_index_id:
    description: Three-level UC name of the default index (catalog.schema.index_name)
  sql_warehouse_id:
    description: SQL Warehouse ID
  files_path:
    description: Three-level UC volume name for evidence uploads (catalog.schema.volume)
  postgres_branch:
    description: Full Lakebase Postgres branch resource name. Obtain by running `databricks postgres list-branches {project-name}`, select the desired item from the output array and use its .name value. Requires the project resource name.
  postgres_database:
    description: Full Lakebase Postgres database resource name. Obtain by running `databricks postgres list-databases {branch-name}`, select the desired item from the output array and use its .name value. Requires the branch resource name.
  serving_endpoint_name:
    description: Serving endpoint name

resources:
  apps:
    app:
      name: "asic-case-mgmt"
      description: "ASIC Intelligent Case Management"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      # On-behalf-of-user scopes: AUSTRAC-restricted views are queried as the signed-in user so Unity Catalog
      # decides what each user may see (SPEC 10).
      user_api_scopes:
        - sql
        - files.files
        - serving.serving-endpoints

      # The resources which this app has access to.
      resources:
        - name: vector-search-index
          uc_securable:
            securable_full_name: ${var.vector_search_index_id}
            securable_type: TABLE
            permission: SELECT
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: files
          uc_securable:
            securable_full_name: ${var.files_path}
            securable_type: VOLUME
            permission: WRITE_VOLUME
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY

targets:
  default:
    default: true
    workspace:
      host: https://fevm-au-pubsec.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

    variables:
      vector_search_index_id: au_pubsec_catalog.asic_case_management.evidence_chunks_index
      sql_warehouse_id: 083bec41aa3ab495
      files_path: au_pubsec_catalog.asic_case_management.evidence
      postgres_branch: projects/asic-case-management/branches/production
      postgres_database: projects/asic-case-management/branches/production/databases/databricks-postgres
      serving_endpoint_name: databricks-claude-sonnet-4-6
